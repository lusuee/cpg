name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Deploy to Cloudflare Workers
        run: pnpm deploy
        env:
          # Cloudflare Authentication (Required)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          # Admin Auth (Required)
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

          # Database & Gateway Settings (Optional)
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
          GATEWAY_BASE_URL: ${{ vars.GATEWAY_BASE_URL || secrets.GATEWAY_BASE_URL }}
          APP_NAME: ${{ vars.APP_NAME || 'Personal AI Gateway' }}
          CF_ACCESS_ALLOWED_EMAILS: ${{ vars.CF_ACCESS_ALLOWED_EMAILS || secrets.CF_ACCESS_ALLOWED_EMAILS }}

          # Upstream Provider Keys (Optional - Can also be configured directly in Cloudflare / Dashboard)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
