name = "cpg"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Web Dashboard built by the `web` package.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "personal-ai-gateway"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Shown on the Dashboard / Settings page. Replace with your real gateway domain.
GATEWAY_BASE_URL = "https://ai.example.com"
APP_NAME = "Personal AI Gateway"

[triggers]
crons = ["0 1 * * *"]

# Optional Cloudflare KV response caching namespace
# [[kv_namespaces]]
# binding = "CACHE_KV"
# id = "00000000-0000-0000-0000-000000000000"

